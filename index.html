<!doctype html>
<html class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#0a0a0a] text-white overflow-x-hidden">

    <!-- Background Image + Gradient Blobs -->
    <div class="fixed inset-0 -z-10">
        <img src="./milad-fakurian-E8Ufcyxz514-unsplash.jpg" class="w-full h-full object-cover opacity-40">
        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/80 to-[#0a0a0a]"></div>
        <div class="absolute top-20 -left-20 w-96 h-96 bg-amber-500/30 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-20 -right-20 w-96 h-96 bg-orange-600/20 rounded-full blur-[120px]"></div>
    </div>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 bg-black/20 backdrop-blur-2xl border-b border-white/5">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="font-black text-xl tracking-widest uppercase">toji<span class="text-amber-400">fuhiguro</span>
            </div>
            <ul class="hidden md:flex gap-8 text-sm tracking-widest text-white/60">
                <li><a href="#home" class="hover:text-white transition-colors">HOME</a></li>
                <li><a href="#skills" class="hover:text-white transition-colors">SKILLS</a></li>
                <li><a href="#" class="hover:text-white transition-colors">WORK</a></li>
            </ul>
            <button
                class="bg-white text-black px-5 py-2 rounded-full text-sm font-bold hover:bg-amber-400 transition-colors uppercase">see
                Me</button>
        </nav>
    </header>

    <!-- HERO -->
    <section id="home" class="min-h-screen flex flex-col justify-center items-center text-center px-6 pt-20">

        <h1 class="text-[10vw] md:text-[8vw] lg:text-[6vw] font-black leading-[0.9] uppercase">Hi, I'm<br><span
                class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-amber-200 uppercase">toji
                fushiguru</span></h1>
        <p class="mt-6 text-white/50 max-w-xl text-sm md:text-base tracking-wide">from jujutsu kaisen season </p>

    </section>

    <div class="flex justify-evenly flex-wrap gap-6 p-6 bg-black">

        <!-- Card 1 -->
        <div class="bg-amber-800 w-[300px] h-[380px] p-3 rounded-xl overflow-hidden group
              shadow-[0_10px_30px_rgba(0,0,0,0.6)] hover:shadow-[0_0_80px_rgba(245,158,11,0.4)]
              hover:bg-amber-700 transition-all duration-500">
            <img src="./download01.jpg" alt="Toji 1"
                class="w-full h-full object-cover object-top rounded-lg transition-transform duration-500 ease-in-out group-hover:scale-110">
        </div>

        <!-- Card 2 -->
        <div class="bg-amber-800 w-[300px] h-[380px] p-3 rounded-xl overflow-hidden group
              shadow-[0_10px_30px_rgba(0,0,0,0.6)] hover:shadow-[0_0_80px_rgba(245,158,11,0.4)]
              hover:bg-amber-700 transition-all duration-500">
            <img src="./☆.jpg" alt="Toji 2"
                class="w-full h-full object-cover object-top rounded-lg transition-transform duration-500 ease-in-out group-hover:scale-110">
        </div>

        <!-- Card 3 -->
        <div class="bg-amber-800 w-[300px] h-[380px] p-3 rounded-xl overflow-hidden group
              shadow-[0_10px_30px_rgba(0,0,0,0.6)] hover:shadow-[0_0_80px_rgba(245,158,11,0.4)]
              hover:bg-amber-700 transition-all duration-500">
            <img src="./4925880839194272.jpg" alt="Toji 3"
                class="w-full h-full object-cover object-top rounded-lg transition-transform duration-500 ease-in-out group-hover:scale-110">
        </div>

    </div>

</body>

</html>
